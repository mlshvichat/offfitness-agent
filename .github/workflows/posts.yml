name: OFFFITNESS Posts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: generate and review; test: separate channel'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - test

permissions:
  contents: write

concurrency:
  group: offfitness-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
      LIVE_ENABLED: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'true' || 'false' }}
      SCHEDULE_CRON: ${{ github.event.schedule }}
      PREVIEW_HOUR: '9'
      ACTION_MODE: ${{ inputs.mode || 'scheduled' }}
      TZ_NAME: Europe/Moscow
      CHANNEL_ID: '@offfitness'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify delivery guards
        run: python -m unittest discover -s tests -v
      - name: Generate and optionally send post
        run: |
          if [ "$ACTION_MODE" = "scheduled" ]; then
            python reliable.py fitness
          else
            python agent.py
          fi
      - name: Save preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offfitness-preview
          path: out/preview.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Save internal editorial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offfitness-editorial-report
          path: out/editorial-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save durable publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-durable-status
          path: |
            data/fitness-queue.json
            out/fitness-last-review.json
          if-no-files-found: ignore
          retention-days: 7
