name: Live model preview validation
# Includes bounded retries for temporary Gemini outages.
on:
  push:
    branches: [codex/editorial-review-30-posts]
    paths: [.github/workflows/model-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        hour: [19]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ACTION_MODE: preview
      LIVE_ENABLED: 'false'
      PREVIEW_HOUR: ${{ matrix.hour }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - name: Real model generation and mandatory review without Telegram
        run: python validate_models.py
      - name: Internal review diagnostics
        if: always()
        run: cat out/editorial-report.json
      - name: Inspect approved preview
        run: cat out/preview.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-preview-validation-${{ matrix.hour }}
          path: out/
          retention-days: 7
